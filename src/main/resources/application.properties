spring.application.name=workspace-backend

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS}

spring.jpa.hibernate.ddl-auto=none

# Only health goes over HTTP. Boot's default is already health-only
management.endpoints.web.exposure.include=health

# Public callers only see UP/DOWN. Component detail (db, diskSpace)
# would tell an outsider what infrastructure we run.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Split liveness from readiness. Liveness must NOT depend on the DB:
# if Postgres has a blip, a platform that restarts on failed liveness
# would bounce a perfectly healthy JVM for nothing.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db