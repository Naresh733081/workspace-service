spring.application.name=workspace-backend

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS}

# Refresh token cleanup (see RefreshTokenCleanupJob).
#
# cron: Spring format, six fields: second minute hour day-of-month month day-of-week.
#       "0 0 3 * * *" = every day at 03:00 (server time). Use "-" to disable.
#
# retention: how long to keep a row AFTER its token has expired before deleting it.
#       ISO-8601 duration: "P1D" = 1 day. "P" starts a period, "1D" is one day.
#       Anything shorter than a day needs a "T": PT12H = 12 hours, PT30M = 30 minutes.
#       This is only a grace period for debugging and clock differences. Expired
#       tokens are already rejected by signature/expiry, so deleting sooner or
#       later never changes who can log in.
app.cleanup.refresh-tokens.cron=0 0 3 * * *
app.cleanup.refresh-tokens.retention=P1D

spring.jpa.hibernate.ddl-auto=none

# Only health goes over HTTP. Boot's default is already health-only
management.endpoints.web.exposure.include=health

# Public callers only see UP/DOWN. Component detail (db, diskSpace)
# would tell an outsider what infrastructure we run.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Split liveness from readiness. Liveness must NOT depend on the DB:
# if Postgres has a blip, a platform that restarts on failed liveness
# would bounce a perfectly healthy JVM for nothing.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# Request size limits (see RequestSizeLimitFilter).
#
# Max request body. Spring DataSize format: 1MB = 1024*1024 bytes (also KB, GB, or plain bytes).
# Sized so the largest VALID request fits: the biggest field is note content
# (100,000 chars, up to ~4 bytes each as UTF-8 = ~400KB), with JSON escaping headroom.
app.limits.max-request-body=1MB

# We accept no HTML form posts, and Tomcat parses those itself before our
# stream counting can see them, so cap them small instead of leaving Tomcat's 2MB default.
server.tomcat.max-http-form-post-size=8KB

# Boot's default is already 8KB. Stated so the limit is visible. A JWT
# Authorization header is a few hundred bytes, well under it.
server.max-http-request-header-size=8KB

# No endpoint accepts file uploads yet, so multipart parsing stays off. Left on,
# any endpoint would parse multipart bodies (up to 10MB by default) and spill
# them to temp files, and that parsing bypasses RequestSizeLimitFilter.
#
# When the file endpoint is built, switch this on and use limits like these:
#   spring.servlet.multipart.enabled=true
#   spring.servlet.multipart.file-size-threshold=2KB   (in memory below this, temp file above)
#   spring.servlet.multipart.max-file-size=10MB        (per file)
#   spring.servlet.multipart.max-request-size=15MB     (whole request, keep above max-file-size)
# and exempt that path from the 1MB JSON cap in RequestSizeLimitFilter.
spring.servlet.multipart.enabled=false